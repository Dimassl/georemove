name: Deploy ke VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/georemove
            git pull origin main
            /opt/georemove/venv/bin/pip install -r requirements.txt --quiet
            cp public/georemove.html /opt/georemove/public/ 2>/dev/null || true
            sudo systemctl restart georemove
            sleep 3
            sudo systemctl is-active georemove && echo "Deploy berhasil!" || echo "Service gagal start"
